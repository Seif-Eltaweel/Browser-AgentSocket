<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Agent Bro Hands</title>
  <style>
    :root {
      --bg-main: #191919;
      --bg-card: #202020;
      --bg-hover: #262626;
      --bg-active: #2f2f2f;
      --border-subtle: #2e2e2e;
      --border-focus: #2383e2;
      --text-main: #e3e2de;
      --text-muted: #9b9b9b;
      --text-tertiary: #6f6e6b;
      --accent-blue: #2383e2;
      --tag-green-bg: #1c2b23;
      --tag-green-text: #4dab9a;
      --tag-green-border: #284738;
      --tag-red-bg: #351f21;
      --tag-red-text: #ff7369;
      --tag-red-border: #522d30;
      --btn-danger: #eb5757;
      --btn-danger-hover: #d84343;
      --btn-success: #0f7b6c;
      --btn-success-hover: #0b675a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body { 
      width: 360px; 
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; 
      padding: 14px; 
      background-color: var(--bg-main); 
      color: var(--text-main); 
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      line-height: 1.4;
    }

    .header { 
      display: flex; 
      align-items: center; 
      justify-content: space-between; 
      padding-bottom: 12px; 
      margin-bottom: 12px; 
      border-bottom: 1px solid var(--border-subtle);
    }

    .title-wrapper {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .title-icon {
      font-size: 15px;
      line-height: 1;
    }

    .title { 
      font-size: 13.5px; 
      font-weight: 600; 
      color: #ffffff; 
      letter-spacing: -0.2px;
    }

    .status-container { 
      display: flex; 
      align-items: center; 
      justify-content: space-between; 
      margin-bottom: 12px; 
      font-size: 12px;
      background: var(--bg-card);
      padding: 8px 10px;
      border-radius: 5px;
      border: 1px solid var(--border-subtle);
    }

    .control-label {
      color: var(--text-muted);
      font-size: 12px;
    }

    .status-tag { 
      padding: 2px 7px; 
      border-radius: 4px; 
      font-size: 10px; 
      font-weight: 600; 
      letter-spacing: 0.3px;
      text-transform: uppercase;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .status-auto { 
      background: var(--tag-green-bg); 
      color: var(--tag-green-text); 
      border: 1px solid var(--tag-green-border);
    }

    .status-manual { 
      background: var(--tag-red-bg); 
      color: var(--tag-red-text); 
      border: 1px solid var(--tag-red-border);
    }

    .btn { 
      width: 100%; 
      padding: 7px 12px; 
      border: 1px solid transparent; 
      border-radius: 5px; 
      font-weight: 500; 
      font-size: 12px;
      cursor: pointer; 
      transition: background 0.15s ease, border-color 0.15s ease; 
      box-sizing: border-box;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-family: inherit;
    }

    .btn-takeover { 
      background: var(--btn-danger); 
      color: #ffffff; 
      border-color: rgba(255, 255, 255, 0.1);
    }

    .btn-takeover:hover {
      background: var(--btn-danger-hover); 
    }

    .btn-resume { 
      background: var(--btn-success); 
      color: #ffffff; 
      border-color: rgba(255, 255, 255, 0.1);
      margin-top: 8px; 
    }

    .btn-resume:hover {
      background: var(--btn-success-hover); 
    }

    .context-box { 
      display: none; 
      margin-bottom: 12px;
    }

    .context-box.active { 
      display: block; 
    }

    textarea { 
      width: 100%; 
      box-sizing: border-box; 
      background: var(--bg-card); 
      color: var(--text-main); 
      border: 1px solid var(--border-subtle); 
      border-radius: 5px; 
      padding: 8px 10px; 
      resize: none; 
      font-family: inherit; 
      font-size: 12px; 
      line-height: 1.45;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    textarea:focus { 
      border-color: var(--border-focus); 
      box-shadow: 0 0 0 2px rgba(35, 131, 226, 0.2);
      outline: none; 
    }

    label { 
      font-size: 11px; 
      color: var(--text-muted); 
      display: block; 
      margin-bottom: 6px; 
      font-weight: 500;
    }

    /* Agent Connection Panel Styles */
    .section-title {
      font-size: 10.5px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--text-tertiary);
      margin: 16px 0 8px 0;
      padding-bottom: 4px;
    }

    .agent-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 7px 9px;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 5px;
      margin-bottom: 6px;
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    .agent-item:hover {
      background: var(--bg-hover);
      border-color: #383838;
    }

    .agent-info {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      min-width: 0;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .status-dot.online {
      background: #4dab9a;
    }

    .status-dot.offline {
      background: #ff7369;
    }

    .status-dot.disabled {
      background: #555555;
    }

    .agent-text {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .agent-name {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .agent-url {
      font-size: 10.5px;
      color: var(--text-tertiary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 1px;
    }

    .agent-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    
    /* Notion Property Select style */
    .color-select {
      background: #252525;
      border: 1px solid var(--border-subtle);
      border-radius: 4px;
      color: var(--text-muted);
      font-size: 10.5px;
      padding: 2px 4px;
      cursor: pointer;
      outline: none;
      font-family: inherit;
      transition: border-color 0.15s;
    }

    .color-select:focus, .color-select:hover {
      border-color: #404040;
      color: var(--text-main);
    }
    
    /* Toggle switch */
    .switch {
      position: relative;
      display: inline-block;
      width: 28px;
      height: 16px;
      flex-shrink: 0;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #373737;
      transition: background-color 0.2s ease;
      border-radius: 16px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 12px;
      width: 12px;
      left: 2px;
      bottom: 2px;
      background-color: #ffffff;
      transition: transform 0.2s ease;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: var(--accent-blue);
    }

    input:checked + .slider:before {
      transform: translateX(12px);
    }

    .btn-edit {
      background: none;
      border: none;
      color: var(--text-tertiary);
      cursor: pointer;
      font-size: 11px;
      padding: 3px 5px;
      border-radius: 4px;
      transition: background 0.15s, color 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-edit:hover {
      background: var(--bg-hover);
      color: var(--text-main);
    }
    
    .actions-row {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }
    
    .btn-action-outline {
      flex: 1;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      color: var(--text-muted);
      padding: 6px 8px;
      font-size: 11px;
      border-radius: 5px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
      text-align: center;
      font-family: inherit;
    }

    .btn-action-outline:hover {
      background: var(--bg-hover);
      border-color: #3d3d3d;
      color: var(--text-main);
    }
    
    .edit-form-panel {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 5px;
      padding: 10px;
      margin-bottom: 8px;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .edit-form-panel input {
      background: var(--bg-main);
      border: 1px solid var(--border-subtle);
      border-radius: 4px;
      color: var(--text-main);
      padding: 5px 8px;
      font-size: 11.5px;
      outline: none;
      font-family: inherit;
      transition: border-color 0.15s;
    }

    .edit-form-panel input:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 2px rgba(35, 131, 226, 0.2);
    }

    .edit-form-actions {
      display: flex;
      justify-content: flex-end;
      gap: 6px;
      margin-top: 2px;
    }

    .btn-small {
      padding: 4px 8px;
      font-size: 11px;
      border-radius: 4px;
      border: 1px solid transparent;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.15s;
    }

    .btn-save {
      background: var(--accent-blue);
      color: #ffffff;
    }

    .btn-save:hover {
      background: #1a73e8;
    }

    .btn-cancel {
      background: #282828;
      color: var(--text-muted);
      border-color: var(--border-subtle);
    }

    .btn-cancel:hover {
      background: var(--bg-hover);
      color: var(--text-main);
    }

    .btn-delete {
      background: #351f21;
      color: #ff7369;
      border-color: #522d30;
      margin-right: auto;
    }

    .btn-delete:hover {
      background: #462528;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title-wrapper">
      <span class="title-icon">🤖</span>
      <div class="title">Agent Bro Hands</div>
    </div>
    <span id="statusTag" class="status-tag status-auto">Auto Engine</span>
  </div>
  
  <div class="status-container">
    <span class="control-label">Control Mode</span>
    <span id="controlText" style="font-weight: 600; color: #4dab9a; font-size: 11.5px;">Agent Active</span>
  </div>

  <div id="contextBox" class="context-box">
    <label for="interventionNotes">Intervention Note for Agent:</label>
    <textarea id="interventionNotes" rows="2" placeholder="Describe manual overrides here..."></textarea>
  </div>

  <button id="actionBtn" class="btn btn-takeover">Take Over Control</button>

  <div class="section-title">Agent Servers</div>
  <div id="agentList">
    <!-- Populated dynamically via JS -->
  </div>

  <!-- Hidden inline panel for adding/editing servers -->
  <div id="addServerForm" class="edit-form-panel" style="display: none;">
    <input type="text" id="serverNameInput" placeholder="Server Name (e.g., Claude Code)" />
    <input type="text" id="serverUrlInput" placeholder="WS Endpoint (e.g., ws://localhost:8500)" />
    <div class="edit-form-actions">
      <button id="cancelAddBtn" class="btn-small btn-cancel">Cancel</button>
      <button id="saveAddBtn" class="btn-small btn-save">Add Server</button>
    </div>
  </div>

  <!-- Inline panel for editing existing servers -->
  <div id="editServerForm" class="edit-form-panel" style="display: none;">
    <input type="hidden" id="editServerId" />
    <input type="text" id="editServerNameInput" placeholder="Server Name" />
    <input type="text" id="editServerUrlInput" placeholder="WS Endpoint" />
    <div class="edit-form-actions">
      <button id="deleteServerBtn" class="btn-small btn-delete">Delete</button>
      <button id="cancelEditBtn" class="btn-small btn-cancel">Cancel</button>
      <button id="saveEditBtn" class="btn-small btn-save">Save Changes</button>
    </div>
  </div>

  <div class="actions-row">
    <button id="scanAgentsBtn" class="btn-action-outline">🔍 Scan for Agents</button>
    <button id="addServerBtn" class="btn-action-outline">+ Add Agent Server</button>
  </div>

  <script src="protocol.js"></script>
  <script src="popup.js"></script>
</body>
</html>
