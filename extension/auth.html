<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Authorize Agent Bro Hands</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #07050f 0%, #140b25 100%);
      color: #E2DDF0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      overflow: hidden;
    }
    .auth-card {
      width: 420px;
      padding: 32px;
      background: rgba(25, 18, 41, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      backdrop-filter: blur(20px);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6), 0 0 30px rgba(187, 134, 252, 0.1);
      text-align: center;
      animation: zoomIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .logo {
      font-size: 40px;
      margin-bottom: 16px;
      display: inline-block;
      filter: drop-shadow(0 0 10px rgba(187, 134, 252, 0.4));
    }
    .title {
      font-size: 22px;
      font-weight: 800;
      color: #D3B9FF;
      margin: 0 0 12px 0;
      letter-spacing: 0.5px;
      text-shadow: 0 0 10px rgba(187, 134, 252, 0.2);
    }
    .description {
      font-size: 14px;
      color: #A69EBA;
      line-height: 1.6;
      margin: 0 0 28px 0;
    }
    .btn-container {
      display: flex;
      gap: 16px;
      justify-content: center;
    }
    .btn {
      flex: 1;
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .btn-grant {
      background: linear-gradient(90deg, #8b5cf6 0%, #6d28d9 100%);
      color: white;
      box-shadow: 0 4px 12px rgba(109, 40, 217, 0.3);
    }
    .btn-grant:hover {
      background: linear-gradient(90deg, #a78bfa 0%, #7c3aed 100%);
      box-shadow: 0 6px 20px rgba(109, 40, 217, 0.5);
    }
    .btn-deny {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #E2DDF0;
    }
    .btn-deny:hover {
      background: rgba(255, 255, 255, 0.1);
      color: white;
    }
    @keyframes zoomIn {
      from { transform: scale(0.9); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="auth-card">
    <div class="logo">🤖</div>
    <h1 class="title">Authorize Agent Bro Hands</h1>
    <p class="description">
      An external Agent is attempting to establish a local control session. 
      Granting authorization will allow this agent to automate web pages inside secure <strong>"Agent Bro Task"</strong> tab groups.
    </p>
    <div class="btn-container">
      <button id="denyBtn" class="btn btn-deny">Deny</button>
      <button id="grantBtn" class="btn btn-grant">Grant Authorization</button>
    </div>
  </div>
  <script src="auth.js"></script>
</body>
</html>
