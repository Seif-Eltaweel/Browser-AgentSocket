<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Authorize AgentSocket</title>
  <style>
    :root {
      --bg-main: #191919;
      --bg-card: #202020;
      --bg-hover: #262626;
      --border-subtle: #2e2e2e;
      --border-hover: #3d3d3d;
      --text-main: #e3e2de;
      --text-muted: #9b9b9b;
      --accent-blue: #2383e2;
      --accent-blue-hover: #1a73e8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .auth-card {
      width: 400px;
      padding: 28px;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
      text-align: center;
    }

    .logo {
      font-size: 32px;
      margin-bottom: 14px;
      display: inline-block;
      line-height: 1;
    }

    .title {
      font-size: 16px;
      font-weight: 600;
      color: #ffffff;
      margin: 0 0 10px 0;
      letter-spacing: -0.2px;
    }

    .description {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.55;
      margin: 0 0 24px 0;
    }

    .description strong {
      color: var(--text-main);
      font-weight: 600;
    }

    .btn-container {
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    .btn {
      flex: 1;
      padding: 8px 16px;
      border: 1px solid transparent;
      border-radius: 5px;
      font-weight: 500;
      font-size: 13px;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
    }

    .btn-grant {
      background: var(--accent-blue);
      color: #ffffff;
    }

    .btn-grant:hover {
      background: var(--accent-blue-hover);
    }

    .btn-deny {
      background: #282828;
      border-color: var(--border-subtle);
      color: var(--text-muted);
    }

    .session-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      margin-bottom: 16px;
      background: var(--bg-hover);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      font-size: 12px;
      color: var(--text-main);
      font-weight: 500;
    }

    .session-badge .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent-blue);
    }

    .token-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 12px;
      margin-bottom: 16px;
      background: #141414;
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
      font-size: 11px;
    }

    .token-label {
      color: var(--text-muted);
      font-weight: 500;
    }

    .token-code {
      font-family: monospace;
      color: #38bdf8;
      background: #1e293b;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 11px;
      max-width: 220px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .permissions-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 20px;
      text-align: left;
      background: var(--bg-hover);
      padding: 12px;
      border-radius: 6px;
      border: 1px solid var(--border-subtle);
    }

    .perm-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      cursor: pointer;
      font-size: 12px;
    }

    .perm-row input[type="checkbox"] {
      margin-top: 2px;
      cursor: pointer;
      accent-color: var(--accent-blue);
    }

    .perm-label {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .perm-label strong {
      color: var(--text-main);
      font-size: 12px;
    }

    .perm-label small {
      color: var(--text-muted);
      font-size: 11px;
    }

    .btn-deny:hover {
      background: var(--bg-hover);
      border-color: var(--border-hover);
      color: var(--text-main);
    }
  </style>
</head>
<body>
  <div class="auth-card">
    <div class="logo">🔌</div>
    <h1 class="title">Authorize AgentSocket</h1>
    <div id="sessionBadge" class="session-badge">
      <span class="dot"></span>
      <span id="sessionName">AgentSocket Task</span>
    </div>
    <p class="description">
      An external Agent is attempting to establish a local automation session for <strong id="sessionTitleDesc">this task</strong>. 
      Granting authorization will allow this agent to automate web pages inside its dedicated tab group.
    </p>

    <div class="token-container">
      <span class="token-label">Gateway Token:</span>
      <code id="tokenDisplay" class="token-code" title="Ephemeral Gateway Token">verifying...</code>
    </div>

    <div class="permissions-container">
      <label class="perm-row">
        <input type="checkbox" id="enableSubskills" checked />
        <span class="perm-label">
          <strong>Subskills &amp; SOP Playbooks</strong>
          <small>Allow agent to reference and record repeatable workflows</small>
        </span>
      </label>
      <label class="perm-row">
        <input type="checkbox" id="enableVision" />
        <span class="perm-label">
          <strong>Vision &amp; Screenshots</strong>
          <small>Allow agent to capture viewport screenshots</small>
        </span>
      </label>
    </div>

    <div class="btn-container">
      <button id="denyBtn" class="btn btn-deny">Deny</button>
      <button id="grantBtn" class="btn btn-grant">Grant Authorization</button>
    </div>
  </div>
  <script src="protocol.js"></script>
  <script src="auth.js"></script>
</body>
</html>
