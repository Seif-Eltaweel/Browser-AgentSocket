[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentsocket-browser"
version = "1.1.0"
description = "Autonomous Multi-Agent Browser Automation Gateway, FastMCP Server & Chrome MV3 Extension Bridge."
readme = "README.md"
authors = [
    { name = "Seif Eltaweel", email = "github@seifeltaweel.com" }
]
license = "Apache-2.0"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Testing",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "websockets>=12.0",
    "pydantic>=2.6.0",
    "requests>=2.31.0",
    "mcp>=1.0.0",
    "pyyaml>=6.0",
    "platformdirs>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "build>=1.0.0",
]

[project.scripts]
agentsocket = "server.socket_launcher:main"
browser-socket = "server.socket_launcher:main"

[project.urls]
Homepage = "https://github.com/Seif-Eltaweel/Browser-AgentSocket"
Repository = "https://github.com/Seif-Eltaweel/Browser-AgentSocket"
Issues = "https://github.com/Seif-Eltaweel/Browser-AgentSocket/issues"
Documentation = "https://github.com/Seif-Eltaweel/Browser-AgentSocket#readme"

[tool.hatch.build.targets.wheel]
packages = ["server"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
]
ignore = [
    "E501", # Line too long
    "E402", # Module level import not at top of file
    "F401", # Imported but unused
    "F841", # Local variable assigned but unused
    "E713", # Test for membership should be `not in`
    "E741", # Ambiguous variable name
    "F541", # f-string without placeholders
    "F811", # Redefinition of unused name
    "F821", # Undefined name
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".*", "build", "dist", "server/logs", "*.egg-info"]
