[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentsocket-browser"
version = "1.1.0"
description = "Autonomous Multi-Agent Browser Automation Gateway, FastMCP Server & Chrome MV3 Extension Bridge."
readme = "README.md"
authors = [
    { name = "Seif Eltaweel", email = "github@seifeltaweel.com" }
]
license = "Apache-2.0"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Testing",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "websockets>=12.0",
    "pydantic>=2.6.0",
    "requests>=2.31.0",
    "mcp>=1.0.0",
    "pyyaml>=6.0",
    "platformdirs>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
]

[project.scripts]
agentsocket = "server.socket_launcher:main"
browser-socket = "server.socket_launcher:main"

[tool.hatch.build.targets.wheel]
packages = ["server"]

[tool.ruff]
line-length = 120
target-version = "py310"
